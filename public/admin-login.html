<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>On-Tour — Admin Authentication</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/home.css">
</head>
<body>
  <header class="app-header">
    <div class="app-logo">ON-TOUR <span>| Admin Portal</span></div>
    <a href="/" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">&larr; Back to Home</a>
  </header>

  <main class="hero-container">
    <div class="hero-card">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔐</div>
      <h1>Admin Studio Access</h1>
      <p>Enter the administrator password to manage tour presentations and monitor clients.</p>

      <div id="alertBox" class="alert-box" style="display: none;"></div>

      <form id="adminDirectForm" onsubmit="handleDirectLogin(event)">
        <div class="form-group">
          <label for="adminPass">Administrator Password</label>
          <input type="password" id="adminPass" placeholder="••••••••" required autocomplete="current-password" autofocus>
        </div>
        <button type="submit" id="submitBtn" class="btn-accent" style="width: 100%; margin-top: 0.5rem;">Enter Admin Studio</button>
      </form>
    </div>
  </main>

  <script>
    async function handleDirectLogin(e) {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');
      const password = document.getElementById('adminPass').value;

      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/admin';
        } else {
          alertBox.textContent = data.error || 'Authentication rejected. Check your password.';
          alertBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Enter Admin Studio';
        }
      } catch (err) {
        alertBox.textContent = 'Network or server error during authorization.';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enter Admin Studio';
      }
    }
  </script>
</body>
</html>
